<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="pipelineTitle pipelineDesc">
  <title id="pipelineTitle">Review pipeline</title>
  <desc id="pipelineDesc">A local CSV passes through normalize, segmentation, the category classifier, the sentiment probe and magnet routing, then aggregation and the overview.</desc>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace">
    <line x1="28" y1="44" x2="28" y2="258" stroke="#363533" stroke-width="1"/>
    <g fill="#363533">
      <circle cx="28" cy="50" r="4"/><circle cx="28" cy="88" r="4"/><circle cx="28" cy="126" r="4"/>
      <circle cx="28" cy="164" r="4"/><circle cx="28" cy="202" r="4"/><circle cx="28" cy="240" r="4"/>
    </g>
    <g fill="#F9F5EF" font-size="11">
      <text x="46" y="54">CSV</text><text x="46" y="92">Normalize</text><text x="46" y="130">Segment</text>
      <text x="46" y="168">Classify</text><text x="46" y="206">Probe + facets</text><text x="46" y="244">Aggregate + UI</text>
    </g>
    <g fill="#959089" font-size="8.5">
      <text x="46" y="68">local file</text><text x="46" y="106">SQLite + dedupe</text><text x="46" y="144">sentence units</text>
      <text x="46" y="182">one DeBERTa seed</text><text x="46" y="220">sentiment + magnets</text><text x="46" y="258">stats + JSON</text>
    </g>
    <circle cx="28" cy="202" r="5" fill="#C42B3E"/>
    <text x="16" y="300" fill="#959089" font-size="8.5">FIT OFFLINE / SERVE SAVED WEIGHTS</text>
  </g>
</svg>
